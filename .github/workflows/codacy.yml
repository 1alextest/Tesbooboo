# Docker invocation follows the Codacy 7.10.4 wrapper:
# https://github.com/codacy/codacy-analysis-cli/blob/dd61b2eef7c1ca8302f6223ee28bba68e2527a8d/bin/codacy-analysis-cli.sh

name: Codacy Security Scan

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "development" ]
  schedule:
    - cron: '25 8 * * 3'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    # Bound an unresponsive scanner; a timeout fails the job and cannot publish SARIF.
    # This is an operational ceiling, not proof of completed analysis.
    timeout-minutes: 180
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Test Codacy diagnostic and output guards
        run: python3 -B -m unittest discover -s scripts -p 'test_codacy_*.py'

      - name: Inventory Codacy input encoding and aliases
        run: python3 -B scripts/codacy_input_diagnostics.py

      - name: Run Codacy Analysis CLI
        id: scan
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          # On pull_request, checkout and the SARIF uploader both use the event
          # merge commit. Do not label that tree with the contributor head SHA.
          scan_commit=$(git rev-parse HEAD)
          if [[ "$scan_commit" != "$GITHUB_SHA" ]]; then
            echo 'Codacy checkout does not match the event commit' >&2
            exit 1
          fi
          echo "Codacy source commit: $scan_commit"
          # Same 7.10.4 image and analyzer defaults as the upstream action. Use its
          # published digest and Docker's container ID to supervise the formatter.
          image=codacy/codacy-analysis-cli:7.10.4@sha256:2ae34a48ca2a70b221dd51f470edca878db01d3f7186f34e397595bef287978a
          cidfile="$RUNNER_TEMP/codacy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.cid"
          # Analyzer diagnostics can contain repository text. Keep workflow
          # command processing disabled while it is streamed to the job log.
          marker=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$marker"
          trap 'echo "::$marker::"' EXIT
          docker run --rm --cidfile "$cidfile" \
            --env "CODACY_CODE=$GITHUB_WORKSPACE" --env CODACY_PROJECT_TOKEN \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --volume /tmp:/tmp \
            "$image" -- analyze --skip-commit-uuid-validation --commit-uuid "$scan_commit" \
            --verbose --format sarif --output "$GITHUB_WORKSPACE/results.sarif" \
            --gh-code-scanning-compat --fail-if-incomplete --max-allowed-issues 2147483647 \
            2>&1 | python3 -u scripts/codacy_output_guard.py "$cidfile"

      # Temporary diagnostic experiment on this PR only. The failed primary
      # SARIF scan remains failed. Never upload this partial analysis.
      - name: Correlate raw analyzer issue paths with encoding candidates
        if: ${{ failure() && steps.scan.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.number == 240 }}
        timeout-minutes: 30
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          scan_commit=$(git rev-parse HEAD)
          [[ "$scan_commit" == "$GITHUB_SHA" ]]
          diagnostic_dir=$(mktemp -d /tmp/codacy-json.XXXXXXXX)
          cidfile="$diagnostic_dir/cli.cid"
          cleanup() {
            if [[ -f "$cidfile" ]]; then
              id=$(cat "$cidfile")
              if [[ "$id" =~ ^[0-9a-f]{64}$ ]]; then
                docker kill "$id" >/dev/null 2>&1 || true
              fi
            fi
            rm -rf -- "$diagnostic_dir"
          }
          trap cleanup EXIT
          image=codacy/codacy-analysis-cli:7.10.4@sha256:2ae34a48ca2a70b221dd51f470edca878db01d3f7186f34e397595bef287978a
          status=0
          # Same revision, image, tools and settings. Change only the formatter.
          # Raw reports/logs can contain sensitive source; never stream or upload them.
          timeout 25m docker run --rm --cidfile "$cidfile" \
            --env "CODACY_CODE=$GITHUB_WORKSPACE" --env CODACY_PROJECT_TOKEN \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --volume /tmp:/tmp \
            "$image" -- analyze --skip-commit-uuid-validation --commit-uuid "$scan_commit" \
            --verbose --format json --output "$diagnostic_dir/results.json" \
            --fail-if-incomplete --max-allowed-issues 2147483647 \
            >"$diagnostic_dir/cli.log" 2>&1 || status=$?
          echo "Codacy JSON diagnostic exit status: $status (not acceptance)"
          python3 -B scripts/codacy_input_diagnostics.py --correlate "$diagnostic_dir/results.json"

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934
        with:
          sarif_file: results.sarif
