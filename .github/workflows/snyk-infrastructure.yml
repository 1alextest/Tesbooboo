# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out your Infrastructure as Code Configuration files,
# such as Kubernetes, Helm & Terraform and scans them for any security issues.
# The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Infrastructure as Code

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "development" ]
  schedule:
    - cron: '28 4 * * 3'

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Discover supported infrastructure-as-code targets
        id: iac
        shell: bash
        run: |
          set -euo pipefail
          # Docker Compose is not a supported Snyk IaC scan target here.
          # Do not present an empty scan or a guessed deployment manifest as coverage.
          targets="$(git ls-files | awk '/(^|\/)(terraform|k8s|kubernetes|helm|charts|cloudformation)\/.*\.(yaml|yml|json|tf)$|\.tf$/')"
          if [ -z "$targets" ]; then
            echo "has_iac=false" >> "$GITHUB_OUTPUT"
            echo "Not applicable: no supported Terraform, Kubernetes, Helm or CloudFormation targets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_iac=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$targets"
          fi

      - name: Require configured Snyk credential for a real scan
        if: steps.iac.outputs.has_iac == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN is required when supported IaC exists; no scan was performed"
            exit 1
          fi

      - name: Scan actual infrastructure-as-code sources
        id: scan
        if: steps.iac.outputs.has_iac == 'true'
        continue-on-error: true
        uses: snyk/actions/iac@14818c4695ecc4045f33c9cee9e795a788711ca4
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: .

      - name: Refuse a missing Snyk SARIF report
        if: steps.iac.outputs.has_iac == 'true'
        run: test -s snyk.sarif

      - name: Upload result to GitHub Code Scanning
        if: steps.iac.outputs.has_iac == 'true'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934
        with:
          sarif_file: snyk.sarif
