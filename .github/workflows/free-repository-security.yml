name: Free repository security
on:
  pull_request:
  push:
    branches: [development, main]
  schedule:
    - cron: "29 2 * * 4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-security:
    name: workflow-security
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install zizmor (open source) from PyPI
        run: pipx install zizmor
      - name: Report GitHub Actions security findings
        run: zizmor --format github --min-severity high .github/workflows

  current-tree-secrets:
    name: current-tree-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan current repository contents for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --exit-code 1
