# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  schedule:
    - cron: '29 17 * * 4'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934
        with:
          sarif_file: devskim-results.sarif
