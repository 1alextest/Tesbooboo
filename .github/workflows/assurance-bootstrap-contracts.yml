# Unprivileged PR-only bootstrap proof. This is NOT the enforcement publisher.
name: Assurance bootstrap contracts
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance-bootstrap-contracts:
    name: assurance-bootstrap-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Execute actual source, approval and status-publisher negative controls
        run: node --test scripts/assurance-pr-gate.test.mjs scripts/publish-assurance-status.test.mjs
      - name: Compare reviewed core source blobs with current development
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected file; do
            actual="$(git hash-object "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "Bootstrap source mismatch: $file" >&2
              exit 1
            fi
          done <<'BLOBS'
          ade522787581b2124d45c455c79ae833a6edaa2c scripts/assurance-pr-gate.mjs
          fdf65bad0b0325f03a300ee415622336e155d0e0 scripts/assurance-pr-gate.test.mjs
          856d664b0f6165ae6ffbfc75394866bd9c2379cf scripts/publish-assurance-status.mjs
          670c01c986dafa933fe431b36603064933f238e5 scripts/publish-assurance-status.test.mjs
          9b396e0aa7160b68453e99273a9ef285ea02f125 .github/assurance-policy.json
          3910a61102a8765876f5134475be1a2e1506da63 .github/workflows/assurance-pr-gate.yml
          BLOBS
