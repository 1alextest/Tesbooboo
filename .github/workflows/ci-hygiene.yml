name: CI hygiene

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified actionlint release
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.7"
          curl -fLsS --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          curl -fLsS --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" -o /tmp/checksums.txt
          grep "actionlint_${version}_linux_amd64.tar.gz" /tmp/checksums.txt | awk '{print $1 "  /tmp/actionlint.tar.gz"}' | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      - name: Validate GitHub Actions workflows
        run: /tmp/actionlint -color

  migration-names:
    name: migration-names
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Prove migration-history checks without a database
        run: node --test scripts/check-migrations.test.mjs
      - name: Validate SQL numbering and append-only history
        run: node scripts/check-migrations.mjs --base "$QUALITY_BASE_REF"

  mbt-symbolic-pilot:
    name: mbt-symbolic-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify offline finite-model semantics
        run: node --test docs/examples/mbt-finite-semantics-pilot.test.mjs
