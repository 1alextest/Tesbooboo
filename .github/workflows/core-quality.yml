name: Core code quality

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-quality:
    name: architecture-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Root quality-tool dependency security
        # Same high/critical threshold as npm audit, with one scoped, expiring exception in
        # scripts/audit-exceptions.json for an advisory that has no patched release and sits in
        # build/dev tooling (GHSA-fc5q-39xc-vjpf). Any advisory without a matching, unexpired
        # exception still fails, as does a stale exception.
        run: node scripts/audit-gate.mjs --dir . --scope root
      - name: Prove quality gates with positive and seeded-negative fixtures
        run: npm run test:quality
      - name: Analyze architecture and publish the shared dependency graph
        run: npm run quality:architecture
      - name: Reject lint-baseline inflation and identify policy-review changes
        if: ${{ !cancelled() }}
        run: node scripts/check-quality-policy.mjs --base "$QUALITY_BASE_REF"
      - name: Reject new substantial production-code copies
        if: ${{ !cancelled() }}
        run: npm run quality:duplication -- --base "$QUALITY_BASE_REF"
      - name: Map cross-system impact without skipping existing test lanes
        if: ${{ !cancelled() }}
        run: npm run quality:impact -- --base "$QUALITY_BASE_REF" --graph reports/quality/dependencies.json --output reports/quality/impact.json
      - name: Publish the static impact plan for review
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { formatMarkdown } from "./scripts/test-impact.mjs";
          const summary = formatMarkdown(JSON.parse(fs.readFileSync("reports/quality/impact.json", "utf8")));
          fs.writeFileSync("reports/quality/impact.md", summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Retain architecture, reuse and impact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: architecture-impact-evidence
          if-no-files-found: error
          retention-days: 14
          path: reports/quality/

  backend-quality:
    name: backend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Tesbo-Backend-Nest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tesbo-Backend-Nest/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Backend typecheck
        run: npm run typecheck
      - name: Backend lint (frozen legacy baseline; zero new errors)
        run: node ../scripts/check-lint-baseline.mjs backend
      - name: Backend production and development high/critical-advisory gate
        # Writes the complete audit for the retained artifact while applying the same scoped
        # exception policy as the other trees; only GHSA-fc5q-39xc-vjpf is waived here.
        run: node ../scripts/audit-gate.mjs --dir . --scope backend --json-output backend-audit-all.json
      - name: Retain complete backend development and production audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-all-dependency-audit
          if-no-files-found: error
          retention-days: 14
          path: Tesbo-Backend-Nest/backend-audit-all.json
      - name: Backend development-tool security and CLI compatibility regressions
        run: node --test ../scripts/backend-toolchain-security.test.mjs
      - name: Backend production compilation
        run: npm run build
      - name: Backend unit and integration regressions
        run: npm test -- --coverage --coverageReporters=text-summary

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Tesbo-Frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tesbo-Frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Frontend lint (frozen legacy baseline; zero new errors)
        run: node ../scripts/check-lint-baseline.mjs frontend
      - name: Frontend production and development high/critical-advisory gate
        # Same scoped exception policy; the frontend entry documents that the vulnerable package
        # arrives through Sentry's build-time bundler plugin, not a runtime request path.
        run: node ../scripts/audit-gate.mjs --dir . --scope frontend
      - name: Frontend TypeScript
        run: npx tsc --noEmit
      - name: Frontend content security, document-write and MCP diagnostic regressions
        run: node --test ../scripts/frontend-content-security.test.mjs ../scripts/document-write-queue.test.mjs ../scripts/model-run-recovery.test.mjs ../scripts/mcp-connection-check.test.mjs ../scripts/mcp-deploy-check.test.mjs
      - name: Frontend production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  sdk-quality:
    name: sdk-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/playwright-reporter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/playwright-reporter/package-lock.json
      - run: npm ci --ignore-scripts
      - name: SDK typecheck
        run: npm run typecheck
      - name: SDK production compilation
        run: npm run build
      - name: SDK tests
        run: npm test
      - name: SDK installed-tarball consumer contracts
        run: npm run test:package-consumer
