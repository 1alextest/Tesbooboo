# Trusted policy runs from the base repository DEFAULT BRANCH, never the PR merge.
# The branch rulesets must independently require the exact "specification-assurance"
# check published onto the PR head by this trusted workflow.
name: Specification assurance review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  # GitHub's pull_request_review workflow definition is PR-editable: deliberately
  # DO NOT use it. A reviewer can request a fresh decision with this PR comment.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recompute after a reviewer decision
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  assurance-policy-publisher:
    name: assurance-policy-publisher
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null && github.event.comment.body == '/recheck-assurance')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This checkout MUST NEVER use github.event.pull_request.head.sha,
      # a pull request merge ref, fork repository or its artifacts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Publish exact-PR-head authorization and review status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: node scripts/publish-assurance-status.mjs
