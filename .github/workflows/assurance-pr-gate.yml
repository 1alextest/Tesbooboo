# Trusted policy must run from repository DEFAULT BRANCH, never a PR merge,
# fork checkout, untrusted artifact or user-controlled action.
# A repository-authorized owner/coordinator dispatches a fresh evaluation via
# POST /repos/{owner}/{repo}/dispatches with:
# {"event_type":"specification-assurance-recheck","client_payload":{"pr_number":123}}
# This trigger does not automatically recheck PR updates. Until an authorized
# dispatcher and a required exact-head ruleset check are active, this is inert
# preparation, NOT merge enforcement.
name: Specification assurance review gate

on:
  repository_dispatch:
    types: [specification-assurance-recheck]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  assurance-policy-publisher:
    name: assurance-policy-publisher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Repository dispatch runs on the default branch. Never check out PR code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Publish exact-PR-head review and evidence status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: node scripts/publish-assurance-status.mjs
