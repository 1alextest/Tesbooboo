name: Specification assurance review gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  specification-assurance:
    name: specification-assurance
    if: github.event.pull_request.base.ref == 'development' || github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'feat/assurance-enforcement-graph-preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Execute the policy from the trusted BASE. PR-authored scripts cannot approve themselves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify protected specification approval and exact-head review evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assurance-pr-gate.mjs
