name: Repository secret guard

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-guard:
    name: secret-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked Tesbo reporter credentials
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch e2e/tesbo.config.json >/dev/null 2>&1; then
            echo "::error::Do not commit e2e/tesbo.config.json. Set TESBO_API_TOKEN in Actions Secrets."
            exit 1
          fi
          # Match genuine Tesbo token shapes without printing the matching secret.
          if git grep -q -I -E 'tsbo_[[:xdigit:]]{48}' -- .; then
            echo "::error::A potential Tesbo API token is present in tracked source. Rotate it before proceeding."
            exit 1
          fi
          echo "Tracked repository files contain no Tesbo-format API tokens."
  reporter-safety:
    name: reporter-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck Playwright test sources without importing runtime fixtures
        env:
          TESBO_REPORTER_ENABLED: "0"
        run: npx tsc --noEmit --project tsconfig.json
