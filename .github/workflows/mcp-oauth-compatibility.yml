name: MCP OAuth embedded compatibility spike

on:
  pull_request:
    paths:
      - ".github/workflows/mcp-oauth-compatibility.yml"
      - "Tesbo-Backend-Nest/scripts/ci/embedded-oauth-spike.cjs"
      - "Tesbo-Backend-Nest/src/auth/**"
      - "Tesbo-Backend-Nest/src/common/request.types.ts"
      - "Tesbo-Backend-Nest/Dockerfile"
      - "Tesbo-Backend-Nest/package*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-provider-compatibility:
    name: embedded-provider-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tesbo-Backend-Nest/package-lock.json
      - name: Install existing backend (unchanged lockfile)
        working-directory: Tesbo-Backend-Nest
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned provider in an isolated test-only directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tesbo-oidc-spike"
          npm install --prefix "$RUNNER_TEMP/tesbo-oidc-spike" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund oidc-provider@9.15.1
          node Tesbo-Backend-Nest/scripts/ci/embedded-oauth-spike.cjs "$RUNNER_TEMP/tesbo-oidc-spike"
      - name: Build actual existing Node 22 production runtime image
        run: docker build -f Tesbo-Backend-Nest/Dockerfile -t tesbo-embedded-oauth-spike:ci Tesbo-Backend-Nest
      - name: Test ESM provider mount in the actual Node 22 production runtime (isolated network)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,src=$RUNNER_TEMP/tesbo-oidc-spike,dst=/opt/tesbo-oidc-spike,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/Tesbo-Backend-Nest/scripts/ci/embedded-oauth-spike.cjs,dst=/app/embedded-oauth-spike.cjs,readonly" \
            --entrypoint node tesbo-embedded-oauth-spike:ci \
            /app/embedded-oauth-spike.cjs /opt/tesbo-oidc-spike
