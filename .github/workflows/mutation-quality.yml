name: Mutation effectiveness
on:
  pull_request:
  schedule:
    - cron: "23 3 * * 6"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation-critical:
    name: mutation-critical
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Tesbo-Backend-Nest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Tesbo-Backend-Nest/package-lock.json
      - id: dependencies
        run: npm ci --ignore-scripts
      - name: Mutate bounded critical security utility and run real Jest assertions
        run: npm run test:mutation
      - name: Check that the pilot selects executable guards and refuses source decoys
        id: qa_scope
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test stryker.qa-handoff.config.test.cjs
      - name: Record the existing handoff and producer-identity test baseline
        id: qa_baseline
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.qa_scope.outcome == 'success' }}
        run: |
          mkdir -p reports/mutation
          ./node_modules/.bin/jest --config jest.qa-handoff-mutation.config.cjs --runInBand --json --outputFile=reports/mutation/qa-handoff-baseline.json
      - name: Probe the three reviewed handoff and attribution guards
        if: ${{ !cancelled() && steps.qa_baseline.outcome == 'success' }}
        run: ./node_modules/.bin/stryker run stryker.qa-handoff.config.cjs
      - name: Recheck the original code after mutation testing
        if: ${{ !cancelled() && steps.qa_baseline.outcome == 'success' }}
        run: ./node_modules/.bin/jest --config jest.qa-handoff-mutation.config.cjs --runInBand --json --outputFile=reports/mutation/qa-handoff-restored.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutation-report
          if-no-files-found: ignore
          retention-days: 14
          path: Tesbo-Backend-Nest/reports/mutation/
