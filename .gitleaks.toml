# These exact, independently verified content hashes are retained review evidence.
# Both the repository-root path and the detector's complete match must agree.
# Keep every default rule; a new receipt or digest requires a reviewed exception.
[extend]
useDefault = true

[[allowlists]]
description = "Verified source9519 and canonical contract hashes in the two retained Green profiles"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(?:/repo/)?docs/specs/agent-synchronized-engineering/reviews/2026-11-19-independent/native-green-profile-9519(?:-v2)?\.json$''']
regexTarget = "match"
regexes = ['''^(?:api\.ts": "962dcaf20576c2603f30c4b438bdbef9bf83ffb687024a9d89c65dc0ae468412|04_MCP_API_CONTRACTS\.md": "5893a48fe504a8d5c6b47bb552c493685e950fab62d44334702a92edc7c9474d)"$''']

[[allowlists]]
description = "Verified source965 API content hash in the original occurrence repair receipt"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(?:/repo/)?docs/specs/agent-synchronized-engineering/reviews/2026-11-19-independent/native-occurrence-repair-evidence\.json$''']
regexTarget = "match"
regexes = ['''^api\.ts": "b8f6f6fdf4ce97aca68824b9eae3b08d22cbdb6c0abf56989429f3f74b5a492d"$''']

[[allowlists]]
description = "Verified source965 and canonical contract hashes in the retained Green v3 profile"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(?:/repo/)?docs/specs/agent-synchronized-engineering/reviews/2026-11-19-independent/native-green-profile-965a87a1-v3\.json$''']
regexTarget = "match"
regexes = ['''^(?:api\.ts": "b8f6f6fdf4ce97aca68824b9eae3b08d22cbdb6c0abf56989429f3f74b5a492d|04_MCP_API_CONTRACTS\.md": "5893a48fe504a8d5c6b47bb552c493685e950fab62d44334702a92edc7c9474d)"$''']

# Both 40-character values below are independently resolved Git commit IDs,
# not Sourcegraph credentials. Frozen Blue review receipt must remain unchanged.
# Regex segmentation avoids adding new plain 40-hex tokens to this config.
[[allowlists]]
description = "Exact pinned Git commit objects in one immutable original Blue receipt"
targetRules = ["sourcegraph-access-token"]
condition = "AND"
paths = ['''^(?:/repo/)?docs/specs/agent-synchronized-engineering/reviews/2026-11-19-gex-rerun/receipts/blue-a-v1\.md$''']
regexTarget = "match"
regexes = ['''^(?:6897f989b055a955280f(?:810c7daace86f74057fa)|d83549c85a4dcd047fb40(?:dc4fba4ec62737ab0fc))
'']
